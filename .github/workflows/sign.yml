name: Sign and release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: sign
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    # Mozilla's signing usually takes 3–12 minutes; stop well before anything runs away.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

      - name: Work out the release tag
        id: version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest version $version. Bump extension/manifest.json or retag."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Sign with addons.mozilla.org (unlisted)
        run: npm run sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}

      - name: Upload the .xpi to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(web-ext-artifacts/*.xpi)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Signing produced no .xpi"
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "Apply Kit $TAG" --notes "Signed unlisted build."
          fi

      # Installed copies check updates.json on main (the manifest's update_url) about once
      # a day, and install whatever version it lists, after checking the hash.
      - name: Point auto-updates at this release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          xpi=$(ls web-ext-artifacts/*.xpi | head -1)
          export XPI_NAME=$(basename "$xpi") XPI_HASH=$(sha256sum "$xpi" | cut -d' ' -f1)
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main
          node <<'EOF'
          const fs = require("fs");
          const { TAG, XPI_NAME, XPI_HASH, GITHUB_REPOSITORY } = process.env;
          const id = require("./extension/manifest.json").browser_specific_settings.gecko.id;
          const version = TAG.replace(/^v/, "");
          let doc = { addons: {} };
          try { doc = JSON.parse(fs.readFileSync("updates.json", "utf8")); } catch {}
          const entry = doc.addons[id] || (doc.addons[id] = { updates: [] });
          entry.updates = entry.updates.filter(u => u.version !== version);
          entry.updates.push({
            version,
            update_link: `https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${encodeURIComponent(XPI_NAME)}`,
            update_hash: "sha256:" + XPI_HASH
          });
          fs.writeFileSync("updates.json", JSON.stringify(doc, null, 2) + "\n");
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git diff --cached --quiet || { git commit --quiet -m "Point auto-updates at $TAG"; git push --quiet origin main; }
